name: Preview BoundaryMesh infrastructure

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: Infrastructure federation boundary to verify
        required: true
        default: positive
        type: choice
        options:
          - positive
          - cross_sa_denied
          - wrong_context_denied

permissions:
  contents: read
  id-token: write

jobs:
  preview:
    if: ${{ inputs.test_mode == 'positive' }}
    name: Preview protected infrastructure
    runs-on: ubuntu-latest
    environment: boundarymesh-ci-preview
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out protected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: boundarymesh-dev
          workload_identity_provider: projects/891977254468/locations/global/workloadIdentityPools/boundarymesh-github/providers/github-actions
          service_account: boundarymesh-ci-preview@boundarymesh-dev.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Set up Pulumi CLI
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
        with:
          pulumi-version: 3.262.0

      - name: Install infrastructure dependencies
        run: npm ci

      - name: Build infrastructure program
        run: npm run build

      - name: Select shared Pulumi backend
        run: pulumi login gs://bm-pulumi-state-eu4-21cad20b325f

      - name: Preview infrastructure
        run: pulumi preview --stack dev --diff --non-interactive --suppress-permalink

  cross-sa-denial:
    if: ${{ inputs.test_mode == 'cross_sa_denied' }}
    name: Reject CI context impersonating verification service account
    runs-on: ubuntu-latest
    environment: boundarymesh-ci-preview
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate admitted CI preview identity
        id: admitted_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: boundarymesh-dev
          workload_identity_provider: projects/891977254468/locations/global/workloadIdentityPools/boundarymesh-github/providers/github-actions
          service_account: boundarymesh-ci-preview@boundarymesh-dev.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Attempt forbidden verification service-account impersonation
        id: forbidden_auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: boundarymesh-dev
          workload_identity_provider: projects/891977254468/locations/global/workloadIdentityPools/boundarymesh-github/providers/github-actions
          service_account: boundarymesh-wif-verify@boundarymesh-dev.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Confirm cross-service-account rejection
        if: ${{ always() }}
        shell: bash
        env:
          ADMITTED_OUTCOME: ${{ steps.admitted_auth.outcome }}
          FORBIDDEN_OUTCOME: ${{ steps.forbidden_auth.outcome }}
        run: |
          if [[ "${ADMITTED_OUTCOME}" != "success" ]]; then
            echo "::error::The admitted CI preview identity did not authenticate."
            exit 1
          fi
          if [[ "${FORBIDDEN_OUTCOME}" != "failure" ]]; then
            echo "::error::Forbidden verification service-account impersonation unexpectedly succeeded."
            exit 1
          fi
          echo "Expected cross-service-account impersonation was rejected."

  wrong-context-control:
    if: ${{ inputs.test_mode == 'wrong_context_denied' }}
    name: Prove CI preview context remains admitted
    runs-on: ubuntu-latest
    environment: boundarymesh-ci-preview
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate admitted CI preview identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: boundarymesh-dev
          workload_identity_provider: projects/891977254468/locations/global/workloadIdentityPools/boundarymesh-github/providers/github-actions
          service_account: boundarymesh-ci-preview@boundarymesh-dev.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

  wrong-context-denial:
    if: ${{ inputs.test_mode == 'wrong_context_denied' }}
    needs: wrong-context-control
    name: Reject CI workflow in verification environment
    runs-on: ubuntu-latest
    environment: boundarymesh-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Attempt mismatched workflow and environment context
        id: forbidden_auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: boundarymesh-dev
          workload_identity_provider: projects/891977254468/locations/global/workloadIdentityPools/boundarymesh-github/providers/github-actions
          service_account: boundarymesh-wif-verify@boundarymesh-dev.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Confirm provider-context rejection
        if: ${{ always() }}
        shell: bash
        env:
          FORBIDDEN_OUTCOME: ${{ steps.forbidden_auth.outcome }}
        run: |
          if [[ "${FORBIDDEN_OUTCOME}" != "failure" ]]; then
            echo "::error::Mismatched workflow and environment context unexpectedly authenticated."
            exit 1
          fi
          echo "Expected provider-context mismatch was rejected."
