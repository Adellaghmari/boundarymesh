spring:
  application:
    name: boundarymesh-api
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: false
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    defaults:
      enabled: true

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_1
    path: /v3/api-docs
  swagger-ui:
    enabled: false

boundarymesh:
  service-name: boundarymesh-api
  runtime-mode: ${BOUNDARYMESH_RUNTIME_MODE:LOCAL}
  policy-version: boundary-enforcement.phase10.v1
  worker-base-url: http://127.0.0.1:8081
  dev-evaluate-enabled: false
  dev-security-tools-enabled: false
  security:
    issuer: http://127.0.0.1:8080/api/v1/dev/issuer
    audience: boundarymesh-api
    access-token-ttl: 15m
  webhook:
    freshness-window: 5m
    max-body-bytes: 65536
    quayforge-secret: ""
  entra:
    tenant-id: ${BOUNDARYMESH_ENTRA_TENANT_ID:}
    client-id: ${BOUNDARYMESH_ENTRA_CLIENT_ID:}
    client-secret: ${BOUNDARYMESH_ENTRA_CLIENT_SECRET:}
    redirect-uri: ${BOUNDARYMESH_ENTRA_REDIRECT_URI:http://127.0.0.1:5173/login/oauth2/code/entra}
    frontend-origin: ${BOUNDARYMESH_FRONTEND_ORIGIN:http://127.0.0.1:5173}
    graph-mode: ${BOUNDARYMESH_GRAPH_MODE:HARNESS}
  gcp:
    project: ${BOUNDARYMESH_GCP_PROJECT:boundarymesh-dev}
    location: ${BOUNDARYMESH_GCP_LOCATION:europe-west4}
    firestore-database: ${BOUNDARYMESH_FIRESTORE_DATABASE:boundarymesh}
    pubsub-topic: ${BOUNDARYMESH_PUBSUB_TOPIC:boundarymesh-deliveries}
    pubsub-subscription: ${BOUNDARYMESH_PUBSUB_SUBSCRIPTION:boundarymesh-delivery-worker}
    kms-key-ring: ${BOUNDARYMESH_KMS_KEY_RING:boundarymesh-attestation}
    kms-crypto-key: ${BOUNDARYMESH_KMS_CRYPTO_KEY:exchange-attestation}
    kms-key-version: ${BOUNDARYMESH_KMS_KEY_VERSION:1}

logging:
  level:
    root: INFO
    dev.adellaghmari.boundarymesh: INFO
    org.springframework.security: WARN
