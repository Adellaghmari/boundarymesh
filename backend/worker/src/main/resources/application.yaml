spring:
  application:
    name: boundarymesh-worker
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  port: 8081
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

camel:
  springboot:
    name: boundarymesh-delivery
    main-run-controller: true

boundarymesh:
  gcp:
    project: ${BOUNDARYMESH_GCP_PROJECT:boundarymesh-dev}
    location: ${BOUNDARYMESH_GCP_LOCATION:europe-west4}
    firestore-database: ${BOUNDARYMESH_FIRESTORE_DATABASE:boundarymesh}
    pubsub-topic: ${BOUNDARYMESH_PUBSUB_TOPIC:boundarymesh-deliveries}
    pubsub-subscription: ${BOUNDARYMESH_PUBSUB_SUBSCRIPTION:boundarymesh-delivery-worker}
    kms-key-ring: ${BOUNDARYMESH_KMS_KEY_RING:boundarymesh-attestation}
    kms-crypto-key: ${BOUNDARYMESH_KMS_CRYPTO_KEY:exchange-attestation}
    kms-key-version: ${BOUNDARYMESH_KMS_KEY_VERSION:1}
  worker:
    wiremock-port: 8099
    retry-max-attempts: 3
    retry-wait: 5ms
    retry-after-cap: 50ms
    timeout: 400ms
    circuit-window: 4
    circuit-open-wait: 150ms

logging:
  level:
    root: INFO
    dev.adellaghmari.boundarymesh: INFO
    org.apache.camel: WARN
    org.wiremock: WARN
