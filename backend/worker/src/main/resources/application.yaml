spring:
  application:
    name: boundarymesh-worker
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  port: 8081
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

camel:
  springboot:
    name: boundarymesh-delivery
    main-run-controller: true

boundarymesh:
  worker:
    wiremock-port: 8099
    retry-max-attempts: 3
    retry-wait: 5ms
    retry-after-cap: 50ms
    timeout: 400ms
    circuit-window: 4
    circuit-open-wait: 150ms

logging:
  level:
    root: INFO
    dev.adellaghmari.boundarymesh: INFO
    org.apache.camel: WARN
    org.wiremock: WARN
